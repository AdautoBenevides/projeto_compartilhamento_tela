# coturn configuration for screen-share project
# Runs alongside the signaling server

# Network
listening-port=3478
tls-listening-port=5343
alt-tls-listening-port=5349

# Listen on all interfaces
listening-ip=0.0.0.0

# Authentication
use-auth-secret
static-auth-secret=screen-share-secret

# Relay IP range (let coturn detect automatically)
relay-ip=0.0.0.0
external-ip=0.0.0.0

# Security
stale-nonce=600
max-bps=0
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=0.0.0.0

# Logging
log-file=stdout
verbose

# Performance
proc-quota=30
total-quota=1200
max-port=60000
min-port=49152

# UDP and TCP
no-multicast-peers
no-loopback-peers
no-cli

# Realm
realm=screen-share
server-name=screen-share
